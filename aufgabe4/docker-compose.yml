services:
  data-manager:
    build:
      context: .
      dockerfile: Dockerfile.data-manager
    container_name: data-manager
    ports:
      - "8080:8080"
    volumes:
      - math-factory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  math-factory-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: math-factory-worker-1
    environment:
      INSTANCE_ID: mf-1
      DATA_MANAGER_URL: http://data-manager:8080
    depends_on:
      data-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  math-factory-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: math-factory-worker-2
    environment:
      INSTANCE_ID: mf-2
      DATA_MANAGER_URL: http://data-manager:8080
    depends_on:
      data-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  math-factory-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: math-factory-worker-3
    environment:
      INSTANCE_ID: mf-3
      DATA_MANAGER_URL: http://data-manager:8080
    depends_on:
      data-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  math-factory-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: math-factory-gateway
    environment:
      WORKER_URLS: http://math-factory-worker-1:8081,http://math-factory-worker-2:8081,http://math-factory-worker-3:8081
    ports:
      - "8081:8081"
    depends_on:
      math-factory-worker-1:
        condition: service_healthy
      math-factory-worker-2:
        condition: service_healthy
      math-factory-worker-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  math-factory-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: math-factory-client
    depends_on:
      math-factory-gateway:
        condition: service_healthy
      data-manager:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src

volumes:
  math-factory-data:
