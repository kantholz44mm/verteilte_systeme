services:
  data-manager:
    image: math-factory-data-manager:latest
    environment:
      DATA_DIR: /data
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - math-factory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - math-factory-net

  math-factory-worker:
    image: math-factory-worker:latest
    environment:
      DATA_MANAGER_URL: http://data-manager:8080
    deploy:
      replicas: 3
      # dnsrr makes the service hostname resolve to individual task IPs so the
      # gateway's RoundRobinRouter actually cycles across replicas instead of
      # hitting the single Swarm VIP every time.
      endpoint_mode: dnsrr
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - math-factory-net

  math-factory-gateway:
    image: math-factory-gateway:latest
    environment:
      WORKER_URLS: http://math-factory-worker:8081
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - math-factory-net

networks:
  math-factory-net:
    driver: overlay

volumes:
  math-factory-data:
